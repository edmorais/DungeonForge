# Builds the Windows app on GitHub's servers, so you don't need Rust installed.
# Run it from the Actions tab ("Run workflow"), or push a tag like v1.0.0.
# The installer and the plain .exe appear under the run's "Artifacts".
name: Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm desktop:build

      - uses: actions/upload-artifact@v4
        with:
          name: dungeon-forge-windows
          path: |
            src-tauri/target/release/dungeon-forge.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
