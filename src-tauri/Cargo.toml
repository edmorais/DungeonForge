[package]
name = "dungeon-forge"
version = "1.0.0"
description = "Dungeon Forge: a 3D dungeon sandbox on a 3 ft grid"
authors = []
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "dungeon_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# smaller, faster release exe
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
